plugins { id 'com.android.application' }

android { namespace 'com.jarvis.client'; compileSdk 35
    defaultConfig { applicationId 'com.jarvis.client'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
}

dependencies { implementation 'androidx.appcompat:appcompat:1.7.0'; implementation 'androidx.activity:activity:1.9.2' }
